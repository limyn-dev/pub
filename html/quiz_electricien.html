<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Quiz CFC Électricien</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: une colonne étroite façon fiche de chantier; bande de couleurs des conducteurs en en-tête */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1d2321; --muted:#5d6763; --line:#d9ddda;
  --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --ok:#2e7d3a; --ok-soft:#e4f2e6; --ko:#b3361f; --ko-soft:#f8e5e0;
  --brown:#7a4a26; --black:#1d2321; --grey:#8c9490; --blue:#1f5fbf; --yellow:#e2c21b; --green:#2e8b3a;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --surface:#1d2321; --fg:#e8ebe9; --muted:#9aa49f; --line:#323a37;
  --accent:#6ea0ee; --accent-soft:#1c2a40; --ok:#6cc47a; --ok-soft:#1b2e1f; --ko:#ee7e66; --ko-soft:#3a201a;
  --black:#0a0c0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --surface:#1d2321; --fg:#e8ebe9; --muted:#9aa49f; --line:#323a37;
  --accent:#6ea0ee; --accent-soft:#1c2a40; --ok:#6cc47a; --ok-soft:#1b2e1f; --ko:#ee7e66; --ko-soft:#3a201a;
  --black:#0a0c0b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.wires{display:flex;height:6px;border-radius:3px;overflow:hidden}
.wires span{flex:1}
.pe{background:repeating-linear-gradient(90deg,var(--yellow) 0 10px,var(--green) 10px 20px)}
header h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.05;margin:12px 0 4px;text-wrap:balance;letter-spacing:.01em}
header p{margin:0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{color:var(--accent);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-size:1.15rem;font-weight:600;margin:0;line-height:1.4}
.src{font-size:.8rem;color:var(--muted);margin:-8px 0 0}
.data{font-family:var(--f-mono);font-size:.88rem;background:var(--accent-soft);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);min-width:1.2em}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ko{background:var(--ko-soft);border-color:var(--ko)}
.opt:disabled{cursor:default}
.feedback{border-left:4px solid var(--ok);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.feedback.bad{border-color:var(--ko)}
.feedback strong{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.02em}
.feedback p{margin:0;color:var(--muted)}
.feedback code{font-family:var(--f-mono);font-size:.85rem;color:var(--fg)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font:600 1rem var(--f-body);border:none;background:var(--accent);color:var(--surface);padding:10px 20px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.result h2{font-family:var(--f-display);font-size:3rem;margin:0;line-height:1;font-variant-numeric:tabular-nums}
.result .verdict{margin:0;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cats div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.cats span{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.review{display:flex;flex-direction:column;gap:12px}
.review article{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.review article p{margin:0}
.review .ans{color:var(--ok);font-weight:600}
.review .exp{color:var(--muted);font-size:.92rem}
footer{color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="wires" aria-hidden="true"><span style="background:var(--brown)"></span><span style="background:var(--black)"></span><span style="background:var(--grey)"></span><span style="background:var(--blue)"></span><span class="pe"></span></div>
    <h1>Quiz CFC Électricien</h1>
    <p>Révision type procédure de qualification : calculs, NIBT, schémas et sécurité.</p>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Choisir les thèmes"></div>

  <main id="app" class="card" aria-live="polite"></main>

  <footer>Les valeurs suivent la NIBT et les usages courants en Suisse. Vérifie toujours dans ta NIBT et avec ton école, car les normes évoluent.</footer>
</div>

<script>
const Q = [
 {c:"Calculs",q:"Un moteur triphasé est alimenté en 400 V. Il absorbe 10 A avec un cos φ de 0,85. Quelle est sa puissance active ?",d:"P = √3 · U · I · cos φ",o:["3,40 kW","4,00 kW","5,89 kW","6,93 kW"],a:2,e:"P = 1,732 × 400 × 10 × 0,85 ≈ 5 889 W, donc environ 5,89 kW. 6,93 kW serait la puissance apparente S (sans le cos φ)."},
 {c:"Calculs",q:"Un radiateur de 2 300 W est branché en 230 V. Quelle est sa résistance ?",d:"R = U² / P",o:["10 Ω","23 Ω","100 Ω","230 Ω"],a:1,e:"R = 230² / 2300 = 52 900 / 2300 = 23 Ω. Le courant vaut I = P / U = 10 A."},
 {c:"Calculs",q:"Quelle est la résistance d'un conducteur en cuivre de 20 m et de 1,5 mm² ?",d:"ρ cuivre = 0,0175 Ω·mm²/m\nR = ρ · l / A",o:["0,023 Ω","0,233 Ω","0,525 Ω","2,33 Ω"],a:1,e:"R = 0,0175 × 20 / 1,5 ≈ 0,233 Ω. Pour un circuit aller-retour, il faudrait compter 2 × 20 m."},
 {c:"Calculs",q:"Un circuit monophasé 230 V de 25 m (longueur simple) en 1,5 mm² Cu transporte 10 A, cos φ = 1. Quelle est la chute de tension en % ?",d:"ΔU = 2 · l · I · ρ / A",o:["1,2 %","2,5 %","4,3 %","5,8 %"],a:1,e:"ΔU = 2 × 25 × 10 × 0,0175 / 1,5 ≈ 5,83 V. En pourcentage : 5,83 / 230 ≈ 2,5 %."},
 {c:"Calculs",q:"Dans un réseau 3 × 400 V, quelle tension mesure-t-on aux bornes d'un récepteur couplé en étoile ?",d:"U phase = U ligne / √3",o:["133 V","230 V","400 V","690 V"],a:1,e:"400 / 1,732 ≈ 230 V. En triangle, chaque récepteur recevrait les 400 V."},
 {c:"Calculs",q:"En couplage triangle, quelle relation lie le courant de ligne et le courant dans un enroulement ?",o:["I ligne = I phase","I ligne = I phase / √3","I ligne = √3 · I phase","I ligne = 3 · I phase"],a:2,e:"En triangle, I ligne = √3 × I phase et U ligne = U phase. En étoile, c'est l'inverse : I ligne = I phase et U ligne = √3 × U phase."},
 {c:"Calculs",q:"Un appareil de 2 kW fonctionne 3 heures. Le kWh coûte 0,30 CHF. Combien coûte l'utilisation ?",d:"W = P · t",o:["0,60 CHF","0,90 CHF","1,80 CHF","6,00 CHF"],a:2,e:"W = 2 kW × 3 h = 6 kWh, puis 6 × 0,30 = 1,80 CHF."},
 {c:"Calculs",q:"Un transformateur idéal 230 V / 12 V absorbe 0,5 A au primaire. Quel courant fournit-il au secondaire ?",d:"U1 · I1 = U2 · I2",o:["0,026 A","2,4 A","9,6 A","12 A"],a:2,e:"I2 = U1 · I1 / U2 = 230 × 0,5 / 12 ≈ 9,6 A. Le côté basse tension porte le courant le plus élevé."},
 {c:"Protection & NIBT",q:"Quelle condition doit respecter le choix d'un disjoncteur de protection de ligne ?",d:"Ib : courant d'emploi\nIn : courant nominal du disjoncteur\nIz : courant admissible du câble",o:["In ≤ Ib ≤ Iz","Ib ≤ In ≤ Iz","Iz ≤ In ≤ Ib","Ib ≤ Iz ≤ In"],a:1,e:"Le disjoncteur doit laisser passer le courant d'emploi (Ib ≤ In) tout en protégeant le câble (In ≤ Iz). Iz dépend de la section, du mode de pose et des facteurs de correction."},
 {c:"Protection & NIBT",q:"En schéma TN 230 V, quel est le temps de coupure maximal pour un circuit terminal jusqu'à 32 A ?",o:["0,1 s","0,4 s","1 s","5 s"],a:1,e:"0,4 s pour les circuits terminaux jusqu'à 32 A. Les circuits de distribution peuvent aller jusqu'à 5 s."},
 {c:"Protection & NIBT",q:"Quel courant de déclenchement assigné doit avoir un DDR pour la protection complémentaire des prises ?",o:["10 mA","30 mA","100 mA","300 mA"],a:1,e:"30 mA au maximum. Les 300 mA servent surtout à la protection contre l'incendie."},
 {c:"Protection & NIBT",q:"Que signifie le schéma TN-C-S ?",o:["Le neutre est relié à la terre chez l'abonné uniquement","Un conducteur PEN est séparé en PE et N à un point de l'installation","Il n'y a aucun conducteur de protection","Le réseau est isolé de la terre"],a:1,e:"La partie TN-C utilise un PEN commun. À partir du point de séparation, PE et N sont distincts (TN-S) et ne doivent plus être reliés en aval."},
 {c:"Protection & NIBT",q:"Dans une salle de bain, qu'est-ce que la zone 0 ?",o:["Le volume jusqu'à 60 cm autour de la baignoire","L'intérieur de la baignoire ou du bac de douche","Le reste de la pièce","Le plafond au-dessus de la baignoire"],a:1,e:"La zone 0 est l'intérieur de la baignoire ou du bac. La zone 1 se trouve au-dessus, la zone 2 s'étend sur 60 cm autour de la zone 1."},
 {c:"Protection & NIBT",q:"Un appareil porte le symbole d'un double carré. Quelle classe de protection est-ce ?",o:["Classe 0","Classe I","Classe II","Classe III"],a:2,e:"Classe II : double isolation ou isolation renforcée. L'appareil ne se raccorde pas au PE."},
 {c:"Protection & NIBT",q:"Que signifie le deuxième chiffre du code IP44 ?",o:["Protégé contre les corps solides de plus de 1 mm","Protégé contre les projections d'eau de toutes directions","Protégé contre l'immersion temporaire","Protégé contre les chocs mécaniques"],a:1,e:"Le premier chiffre concerne les corps solides (4 = plus de 1 mm). Le second concerne l'eau (4 = projections de toutes directions)."},
 {c:"Protection & NIBT",q:"Lors du contrôle final, quelle mesure fait-on en premier ?",o:["Le test du DDR","La boucle de défaut","La continuité du conducteur de protection","Le sens du champ tournant"],a:2,e:"On commence hors tension par la continuité du PE et des liaisons équipotentielles, puis l'isolement. Les mesures sous tension (boucle, DDR, champ tournant) viennent ensuite."},
 {c:"Schémas & moteurs",q:"Quel schéma permet de commander une lampe depuis deux endroits ?",o:["Schéma 0","Schéma 1","Schéma 3 (va-et-vient)","Schéma 6 (croisement)"],a:2,e:"Le schéma 3 utilise deux commutateurs va-et-vient reliés par deux conducteurs (navettes)."},
 {c:"Schémas & moteurs",q:"On veut commander une lampe depuis quatre endroits avec des interrupteurs. Combien de schémas 6 (croisement) faut-il ?",o:["1","2","3","4"],a:1,e:"Deux schémas 3 aux extrémités, plus un schéma 6 pour chaque endroit supplémentaire : 4 − 2 = 2. Pour beaucoup d'endroits, on préfère un télérupteur."},
 {c:"Schémas & moteurs",q:"Dans une commande de contacteur, comment réalise-t-on l'auto-maintien ?",o:["Un contact NF du contacteur en série avec le bouton Arrêt","Un contact NO du contacteur en parallèle avec le bouton Marche","Un contact NO du contacteur en série avec la bobine","Un relais thermique en parallèle avec la bobine"],a:1,e:"Le contact NO auxiliaire (13-14) en parallèle avec le bouton Marche garde la bobine alimentée après le relâchement. Le bouton Arrêt (NF) est en série."},
 {c:"Schémas & moteurs",q:"Comment inverse-t-on le sens de rotation d'un moteur asynchrone triphasé ?",o:["En inversant le neutre et le PE","En permutant deux phases","En permutant les trois phases","En passant d'étoile en triangle"],a:1,e:"Permuter deux phases inverse le champ tournant. Avec deux contacteurs, il faut un verrouillage électrique (et souvent mécanique) pour éviter un court-circuit."},
 {c:"Schémas & moteurs",q:"Quel est l'effet du démarrage étoile-triangle sur le courant de démarrage ?",o:["Il est divisé par √3","Il est divisé par 3","Il est doublé","Il ne change pas"],a:1,e:"En étoile, le courant de ligne et le couple valent environ 1/3 de ceux en triangle. Le moteur doit être prévu pour 400 V en triangle."},
 {c:"Schémas & moteurs",q:"Comment améliore-t-on un mauvais cos φ dû à des charges inductives ?",o:["Avec des bobines en série","Avec des condensateurs","Avec un DDR","En augmentant la section des câbles"],a:1,e:"Les condensateurs fournissent la puissance réactive capacitive qui compense la puissance réactive inductive des moteurs ou des ballasts."},
 {c:"Sécurité & matériel",q:"Quelle est la première des 5 règles de sécurité avant de travailler sur une installation ?",o:["Vérifier l'absence de tension","Déclencher et séparer","Mettre à terre et en court-circuit","Protéger contre les parties voisines sous tension"],a:1,e:"Ordre : 1. déclencher et séparer, 2. assurer contre le réenclenchement, 3. vérifier l'absence de tension, 4. mettre à terre et en court-circuit, 5. protéger contre les parties voisines sous tension."},
 {c:"Sécurité & matériel",q:"Quelle couleur est réservée au conducteur neutre ?",o:["Brun","Noir","Gris","Bleu"],a:3,e:"Bleu pour le neutre, jaune-vert pour le PE. Brun, noir et gris servent aux phases (L1, L2, L3)."},
 {c:"Sécurité & matériel",q:"Une personne reste collée à un conducteur sous tension. Que fais-tu en premier ?",o:["Je la tire par le bras","Je coupe le courant ou je l'écarte avec un objet isolant","Je commence la réanimation","J'appelle d'abord son responsable"],a:1,e:"Se protéger d'abord : couper l'alimentation ou dégager la victime avec un objet isolant. Puis alerter le 144 et donner les premiers secours."},
 {c:"Sécurité & matériel",q:"Qui est autorisé à remplacer un fusible Diazed ?",o:["Toute personne présente","Une personne instruite (PI) ou un électricien","Uniquement le fournisseur d'électricité","Uniquement le chef d'entreprise"],a:1,s:"Série 2025 · Pos. 3 Règles de la technique · ex. 10",e:"Le remplacement d'un fusible est réservé aux personnes instruites (PI) ou aux électriciens, dans le respect des règles de sécurité."},
 {c:"Calculs",q:"Un conducteur en cuivre a une résistance de 0,42 Ω pour une section de 2,5 mm². Quelle est sa longueur ?",d:"l = R · A / ρ\nρ cuivre = 0,0175 Ω·mm²/m",o:["6 m","0,6 m","60 m","600 m"],a:2,s:"Série 2024 · Pos. 7 · ex. 2 ; Série 2025 · Pos. 7 · ex. 6",e:"l = 0,42 × 2,5 / 0,0175 = 60 m."},
 {c:"Calculs",q:"Un appareil de 56 W fonctionne 2 h 15 par jour pendant 30 jours. Quelle énergie consomme-t-il ?",d:"W = P · t",o:["1,26 kWh","3,78 kWh","0,126 kWh","37,8 kWh"],a:1,s:"Série 2024 · Pos. 7 · ex. 3",e:"t = 2,25 h × 30 = 67,5 h. W = 0,056 kW × 67,5 h = 3,78 kWh."},
 {c:"Calculs",q:"Deux résistances de 24 Ω et 48 Ω sont montées en série sur 144 V. Quel est le courant total ?",d:"R = R1 + R2\nI = U / R",o:["2 A","3 A","6 A","0,33 A"],a:0,s:"Série 2025 · Pos. 7 · ex. 4",e:"R = 72 Ω, donc I = 144 / 72 = 2 A. Les tensions partielles sont U1 = 48 V et U2 = 96 V."},
 {c:"Calculs",q:"Quelle puissance dissipe une résistance de 300 Ω parcourue par un courant de 30 mA ?",d:"P = R · I²",o:["0,27 W","9 W","2,7 W","0,009 W"],a:0,s:"Série 2024 · Pos. 7 · ex. 9",e:"P = 300 × (0,03)² = 300 × 0,0009 = 0,27 W."},
 {c:"Calculs",q:"Une barre de 5 mm × 20 mm supporte au maximum 3 A/mm². Quel courant maximal peut-elle transporter ?",d:"S = 5 mm × 20 mm = 100 mm²",o:["30 A","60 A","300 A","3 A"],a:2,s:"Série 2024 · Pos. 7 · ex. 5",e:"S = 100 mm², donc I = 3 × 100 = 300 A."},
 {c:"Calculs",q:"Un appareil absorbe 4 kW de puissance active pour une puissance apparente de 5 kVA. Quelle est sa puissance réactive ?",d:"S² = P² + Q²",o:["1 kvar","3 kvar","4 kvar","9 kvar"],a:1,s:"Série 2025 · Pos. 7 · ex. 11",e:"Q = √(5² − 4²) = √9 = 3 kvar."},
 {c:"Calculs",q:"Une pompe absorbe 12 kW avec un rendement de 0,82. Quelle est sa puissance utile ?",d:"η = P utile / P absorbée",o:["9,84 kW","14,6 kW","12 kW","0,82 kW"],a:0,s:"Série 2024 · Pos. 7 · ex. 13",e:"P utile = 12 × 0,82 = 9,84 kW."},
 {c:"Calculs",q:"Quel courant absorbe un grille-pain de 1,2 kW branché en 230 V ?",d:"I = P / U",o:["0,19 A","5,2 A","276 A","0,52 A"],a:1,s:"Série 2025 · Pos. 7 · ex. 14",e:"I = 1200 / 230 ≈ 5,2 A."},
 {c:"Calculs",q:"Un grille-pain de 1,2 kW, un mixeur de 150 W, 3 lampes LED de 5 W et 2 chargeurs de 500 mW sont branchés en 230 V. Quelle est la puissance totale ?",o:["1 366 W","1 216 W","1 515 W","2 866 W"],a:0,s:"Série 2025 · Pos. 7 · ex. 14",e:"1200 + 150 + 3 × 5 + 2 × 0,5 = 1366 W."},
 {c:"Calculs",q:"Un ancien congélateur consomme 1140 kWh par an, un nouveau 475 kWh. Le kWh coûte 0,21 CHF. Quelle est l'économie annuelle ?",d:"Économie = (ancienne − nouvelle consommation) × tarif",o:["139,65 CHF","239,40 CHF","83,25 CHF","1 615 CHF"],a:0,s:"Série 2025 · Pos. 7 · ex. 13",e:"(1140 − 475) × 0,21 = 665 × 0,21 = 139,65 CHF."},
 {c:"Calculs",q:"Une lampe LED absorbe 0,5 A sous 12 V et émet 870 lm. Quelle est son efficacité lumineuse ?",d:"Efficacité = flux lumineux / puissance absorbée",o:["1,74 lm/W","145 lm/W","435 lm/W","6 lm/W"],a:1,s:"Série 2025 · Pos. 7 · ex. 10",e:"P = 12 × 0,5 = 6 W. 870 / 6 = 145 lm/W."},
 {c:"Protection & NIBT",q:"Quelle est la section minimale du conducteur de protection PE pour un conducteur de phase de 25 mm² ?",o:["10 mm²","16 mm²","25 mm²","12,5 mm²"],a:1,s:"Série 2025 · Pos. 3 Règles de la technique · ex. 11",e:"Pour une phase de 16 à 35 mm², le PE minimal est de 16 mm². Au-delà de 35 mm², le PE vaut la moitié de la phase."},
 {c:"Protection & NIBT",q:"Entre quelles valeurs se situe la basse tension (BT) en courant alternatif selon la NIBT ?",o:["0 à 50 V","50 à 1000 V","1000 à 10 000 V","50 à 400 V"],a:1,s:"Série 2025 · Pos. 3 Règles de la technique · ex. 2",e:"La très basse tension (TBT) va jusqu'à 50 V AC. La basse tension va de 50 à 1000 V AC (120 à 1500 V DC)."},
 {c:"Protection & NIBT",q:"Peut-on poser un câble de commande 48 V dans le même conduit qu'un câble d'alimentation moteur 400 V ?",o:["Oui, sans restriction","Non","Oui, si le conduit est métallique","Oui, si le câble est blindé"],a:1,s:"Série 2024 · Pos. 3 Règles de la technique · ex. 8",e:"Des circuits de tensions différentes ne se posent pas ensemble dans un même conduit. Vérifie les exceptions dans la NIBT."},
 {c:"Schémas & moteurs",q:"Trois lampes sont montées en série. Une lampe est défectueuse (circuit ouvert). Que se passe-t-il ?",o:["Une seule lampe reste allumée","Les deux autres restent allumées","Aucune lampe ne s'allume","Les trois lampes brillent davantage"],a:2,s:"Série 2024 · Pos. 7 · ex. 8",e:"En série, le courant ne circule plus si le circuit est ouvert : aucune lampe ne s'allume."},
 {c:"Schémas & moteurs",q:"Trois lampes sont montées en parallèle. Une lampe est défectueuse (ouverte). Que se passe-t-il pour les deux autres ?",o:["Elles restent allumées","Elles s'éteignent aussi","Elles brillent deux fois plus fort","Elles clignotent"],a:0,s:"Série 2024 · Pos. 7 · ex. 8",e:"En parallèle, chaque lampe est reliée directement à la tension. Une lampe coupée n'influence pas les autres."},
 {c:"Schémas & moteurs",q:"Quel type de charge est un corps de chauffe (chauffe-eau) ?",o:["Ohmique","Inductive","Capacitive","Mixte"],a:0,s:"Série 2025 · Pos. 7 · ex. 12",e:"Le corps de chauffe est purement résistif (ohmique) : courant et tension sont en phase. Un moteur est inductif, un condensateur est capacitif."},
 {c:"Bases & énergie",q:"Laquelle de ces énergies est renouvelable ?",o:["Charbon","Uranium","Hydraulique","Gaz naturel"],a:2,s:"Série 2025 · Pos. 7 · ex. 1",e:"L'énergie hydraulique est renouvelable. Le charbon, l'uranium et le gaz naturel ne le sont pas."},
 {c:"Bases & énergie",q:"Un chauffage électrique transforme l'énergie électrique principalement en quelle forme ?",o:["Énergie mécanique","Énergie lumineuse","Énergie calorifique","Énergie chimique"],a:2,s:"Série 2024 · Pos. 7 · ex. 1",e:"Le chauffage transforme l'énergie électrique en chaleur : c'est de l'énergie calorifique."},
 {c:"Bases & énergie",q:"Quelle grandeur est calculée avec la formule I² · R ?",o:["La tension","La puissance","L'énergie","La résistance"],a:1,s:"Série 2024 · Pos. 7 · ex. 4",e:"I² · R donne la puissance (en W) dissipée dans une résistance."},
 {c:"Bases & énergie",q:"Quel symbole représente la puissance réactive ?",o:["P","S","Q","U"],a:2,s:"Série 2025 · Pos. 7 · ex. 11",e:"P = puissance active (W), S = puissance apparente (VA), Q = puissance réactive (var)."},
 {c:"Calculs",q:"Un moteur a un rendement de 0,9 et fournit 30 kW à son arbre. Quelle est sa puissance absorbée ?",d:"η = P utile / P absorbée",o:["27 kW","30,9 kW","33,3 kW","300 kW"],a:2,e:"P absorbée = 30 / 0,9 ≈ 33,3 kW. Les 3,3 kW restants sont perdus sous forme de chaleur.",s:"Série 2021 · Pos. 7 · ex. 1"},
 {c:"Calculs",q:"Un chauffe-eau instantané de 5,10 kW est branché en 3 × 400 V. Quel courant de ligne absorbe-t-il lorsqu'il est enclenché ?",d:"I = P / (√3 · U)",o:["4,4 A","7,4 A","12,7 A","2,9 A"],a:1,e:"I = 5100 / (1,732 × 400) ≈ 7,4 A.",s:"Série 2021 · Pos. 7 · ex. 3"},
 {c:"Calculs",q:"Une torche de fil a une résistance de 0,9 Ω pour une section de 1,5 mm² en cuivre. Quelle est sa longueur ?",d:"l = R · A / ρ ; ρ cuivre = 0,0175 Ω·mm²/m",o:["7,7 m","51 m","77,1 m","771 m"],a:2,e:"l = 0,9 × 1,5 / 0,0175 ≈ 77,1 m.",s:"Série 2021 · Pos. 7 · ex. 6"},
 {c:"Calculs",q:"Cinq fours à raclette sont branchés en 230 V : deux de 1350 W et trois de 1380 W. Quel courant absorbent-ils ensemble ?",d:"P totale = 6840 W ; I = P / U",o:["3,5 A","6,8 A","29,7 A","0,03 A"],a:2,e:"P totale = 2 × 1350 + 3 × 1380 = 6840 W. I = 6840 / 230 ≈ 29,7 A.",s:"Série 2021 · Pos. 7 · ex. 7"},
 {c:"Calculs",q:"Un chauffe-eau chauffe 80 litres d'eau de 15 °C à 90 °C. Quelle énergie calorifique faut-il ?",d:"Q = m · c · Δθ ; c = 4,187 kJ/(kg·°C)",o:["2 512 kJ","300 kJ","25 122 kJ","251 kJ"],a:2,e:"Q = 80 × 4,187 × 75 ≈ 25 122 kJ (1 litre d'eau ≈ 1 kg, Δθ = 75 °C).",s:"Série 2021 · Pos. 7 · ex. 8"},
 {c:"Calculs",q:"Une tension alternative a une valeur efficace de 24 V. Quelle est sa valeur de crête ?",d:"U crête = U eff · √2",o:["12 V","24 V","33,9 V","48 V"],a:2,e:"U crête = 24 × 1,414 ≈ 33,9 V.",s:"Série 2021 · Pos. 7 · ex. 9"},
 {c:"Calculs",q:"Une amélioration réduit la consommation annuelle d'un récepteur de 179,4 kWh. Le kWh coûte 0,15 CHF. Quelle est l'économie annuelle ?",d:"Économie = énergie économisée × tarif",o:["2,69 CHF","26,91 CHF","179,40 CHF","1 794 CHF"],a:1,e:"179,4 × 0,15 = 26,91 CHF.",s:"Série 2021 · Pos. 7 · ex. 11"},
 {c:"Calculs",q:"Un moteur fournit 18,5 kW à son arbre et ses pertes sont de 1500 W. Quelle est sa puissance absorbée ?",d:"P absorbée = P utile + pertes",o:["16,5 kW","18,5 kW","19 kW","20 kW"],a:3,e:"P absorbée = 18,5 + 1,5 = 20 kW.",s:"Série 2021 · Pos. 7 · ex. 16"},
 {c:"Calculs",q:"Un moteur électrique a un rendement de 78 %. Il absorbe 6 kW. Quelle puissance est perdue ?",d:"P perdue = P absorbée × (1 − η)",o:["1,32 kW","4,68 kW","0,78 kW","6,78 kW"],a:0,e:"6 × (1 − 0,78) = 6 × 0,22 = 1,32 kW.",s:"Série 2022 · Pos. 7 · ex. 1"},
 {c:"Calculs",q:"Un fil de cuivre de 1,25 mm² supporte une densité de courant maximale de 4,4 A/mm². Quel courant maximal peut-il transporter ?",d:"I = J · S",o:["0,28 A","1,25 A","4,4 A","5,5 A"],a:3,e:"I = 4,4 × 1,25 = 5,5 A.",s:"Série 2022 · Pos. 7 · ex. 2"},
 {c:"Calculs",q:"Trois résistances de même valeur sont branchées sur un réseau triphasé 3 × 400 V. Le courant de ligne est de 12 A. Quelle est la puissance du circuit ?",d:"P = √3 · U · I (charges résistives)",o:["4,8 kW","8,3 kW","14,4 kW","2,8 kW"],a:1,e:"P = 1,732 × 400 × 12 ≈ 8,3 kW.",s:"Série 2022 · Pos. 7 · ex. 4"},
 {c:"Calculs",q:"Sur un enrouleur 230 V, on branche 2 projecteurs LED de 120 W, un marteau-piqueur de 1,5 kW, un malaxeur de 480 W et un chargeur de 500 mW. Quel courant absorbent-ils ensemble ?",d:"P totale = 2220,5 W ; I = P / U",o:["2,2 A","4,5 A","9,7 A","0,4 A"],a:2,e:"P totale = 240 + 1500 + 480 + 0,5 = 2220,5 W. I = 2220,5 / 230 ≈ 9,7 A.",s:"Série 2022 · Pos. 7 · ex. 7"},
 {c:"Calculs",q:"En remplaçant les ampoules à incandescence par des LED, la consommation annuelle passe de 876 kWh à 97,5 kWh. Le kWh coûte 0,15 CHF. Quelle est l'économie annuelle ?",d:"Économie = (876 − 97,5) × 0,15",o:["13,15 CHF","97,50 CHF","116,78 CHF","131,40 CHF"],a:2,e:"778,5 kWh × 0,15 = 116,78 CHF.",s:"Série 2022 · Pos. 7 · ex. 11"},
 {c:"Calculs",q:"Un moteur absorbe 4 kW de puissance active pour une puissance apparente de 6 kVA. Quelle est sa puissance réactive ?",d:"Q = √(S² − P²)",o:["2 kvar","4,5 kvar","6 kvar","10 kvar"],a:1,e:"Q = √(36 − 16) = √20 ≈ 4,5 kvar.",s:"Série 2022 · Pos. 7 · ex. 13"},
 {c:"Calculs",q:"Un transformateur a 3220 spires au primaire et 168 spires au secondaire, avec U2 = 12 V. Quelle est la tension primaire ?",d:"U1 = U2 × N1 / N2",o:["12 V","115 V","230 V","400 V"],a:2,e:"U1 = 12 × 3220 / 168 = 230 V.",s:"Série 2022 · Pos. 7 · ex. 14"},
 {c:"Calculs",q:"Une ligne de 30 m en cuivre de 1,5 mm² transporte 9,86 A sous 230 V. Quelle est la chute de tension en ligne (aller-retour) ?",d:"ΔU = 2 · l · I · ρ / A",o:["0,35 V","3,45 V","6,9 V","13,8 V"],a:2,e:"ΔU = 2 × 30 × 9,86 × 0,0175 / 1,5 ≈ 6,9 V, soit environ 3 % de 230 V. Il faut compter le conducteur aller et le retour.",s:"Série 2022 · Pos. 7 · ex. 16"},
 {c:"Calculs",q:"Une pompe a une puissance absorbée de 4,14 kW, une puissance utile de 2,36 kW et un rendement de 0,67. Quel est le rendement du moteur ?",d:"η moteur = P utile moteur / P absorbée moteur",o:["57 %","67 %","85 %","92 %"],a:2,e:"Le moteur fournit 2,36 / 0,67 ≈ 3,52 kW à la pompe. η moteur = 3,52 / 4,14 ≈ 85 %.",s:"Série 2023 · Pos. 7 · ex. 1"},
 {c:"Calculs",q:"Une pompe absorbe 9,84 kW. Quelle énergie consomme-t-elle en 24 heures ?",d:"W = P · t",o:["9,84 kWh","12 kWh","236,2 kWh","410 kWh"],a:2,e:"W = 9,84 kW × 24 h = 236,2 kWh.",s:"Série 2023 · Pos. 7 · ex. 4"},
 {c:"Calculs",q:"Un relais est alimenté en 48 V AC avec un courant de 800 mA. Quelle est sa puissance apparente ?",d:"S = U · I",o:["3,8 VA","38,4 VA","60 VA","384 VA"],a:1,e:"S = 48 × 0,8 = 38,4 VA.",s:"Série 2023 · Pos. 7 · ex. 6"},
 {c:"Calculs",q:"Un fil de cuivre (ρ = 0,0175 Ω·mm²/m) a une résistance de 0,4 Ω et une longueur de 40 m. Quelle est sa section ?",d:"A = ρ · l / R",o:["0,175 mm²","1,75 mm²","17,5 mm²","0,7 mm²"],a:1,e:"A = 0,0175 × 40 / 0,4 = 1,75 mm².",s:"Série 2023 · Pos. 7 · ex. 9"},
 {c:"Protection & NIBT",q:"Pour vérifier la continuité d'un conducteur de protection, quelles valeurs de tension à vide et de courant faut-il ?",o:["≤ 24 V et ≥ 200 mA","230 V et 10 A","≤ 50 V et ≥ 1 A","400 V et 30 mA"],a:0,e:"Le contrôle de continuité se fait avec une tension à vide d'au plus 24 V et un courant d'au moins 200 mA.",s:"Série 2021 · Pos. 3 Règles de la technique · ex. 4"},
 {c:"Protection & NIBT",q:"Un tuyau de gaz alimentant une chaudière peut-il être utilisé comme liaison équipotentielle de protection ?",o:["Oui, s'il est métallique","Non, jamais","Oui, s'il est relié à la terre","Oui, dans les locaux secs"],a:1,e:"Une conduite de gaz ne doit jamais servir de liaison équipotentielle de protection.",s:"Série 2021 · Pos. 3 Règles de la technique · ex. 5"},
 {c:"Protection & NIBT",q:"Une mesure d'isolement de 0,2 MΩ sur une nouvelle installation est-elle suffisante ?",o:["Oui, car elle dépasse 0,1 MΩ","Non, elle est inférieure à la valeur minimale de 0,5 MΩ","Oui, car la mesure est faite à 500 V","Non, il faut atteindre 10 MΩ"],a:1,e:"Pour une installation jusqu'à 500 V, la résistance d'isolement minimale est de 0,5 MΩ. Une valeur de 0,2 MΩ est donc insuffisante. Vérifie l'article correspondant de la NIBT.",s:"Série 2022 · Pos. 3 Règles de la technique · ex. 6"},
 {c:"Protection & NIBT",q:"Quels sont les deux types de surintensité qui font déclencher un disjoncteur de canalisation ?",o:["Surcharge et court-circuit","Surtension et surcharge","Défaut d'isolement et contact indirect","Court-circuit et surtension"],a:0,e:"Le disjoncteur de canalisation protège contre les surcharges (courant trop élevé pendant longtemps) et contre les courts-circuits.",s:"Série 2022 · Pos. 3 Règles de la technique · ex. 7"},
 {c:"Protection & NIBT",q:"Quel est le temps de coupure maximal du dispositif de protection d'une prise CEE 63 A ?",o:["0,1 s","0,4 s","1 s","5 s"],a:3,e:"Pour un circuit de distribution ou une prise de plus de 32 A, le temps de coupure maximal est de 5 s. Pour les circuits terminaux jusqu'à 32 A, il est de 0,4 s.",s:"Série 2023 · Pos. 3 Règles de la technique · ex. 8"},
 {c:"Protection & NIBT",q:"Qu'est-ce qu'un conducteur PEN ?",o:["Un conducteur qui combine la fonction de neutre et de protection","Un conducteur de phase de section réduite","Un conducteur qui sert uniquement à la mise à la terre des appareils","Un conducteur isolé de la terre"],a:0,e:"Le conducteur PEN combine les fonctions de neutre (N) et de conducteur de protection (PE).",s:"Série 2022 · Pos. 3 Règles de la technique · ex. 1"},
 {c:"Protection & NIBT",q:"À quoi sert un parafoudre (SPD) ?",o:["Protéger les appareils électriques contre les surtensions","Protéger le bâtiment contre la foudre directe","Protéger les canalisations contre les courants harmoniques","Couper automatiquement le courant en cas de court-circuit"],a:0,e:"Le parafoudre (SPD) limite les surtensions, par exemple celles dues à la foudre, pour protéger les appareils. Il ne protège pas le bâtiment contre les impacts directs.",s:"Série 2021 · Pos. 3 Règles de la technique · ex. 13"},
 {c:"Schémas & moteurs",q:"Une lampe doit pouvoir être commandée depuis trois emplacements. Combien de schémas 6 (croisement) faut-il ?",o:["0","1","2","3"],a:1,e:"Deux schémas 3 aux extrémités, plus un schéma 6 pour chaque emplacement supplémentaire : 3 − 2 = 1.",s:"Série 2021 · Pos. 4 Schéma d'installation · ex. 1"},
 {c:"Schémas & moteurs",q:"Dans une commande de store, pourquoi les relais « OUVRIR » et « FERMER » sont-ils verrouillés l'un par l'autre ?",o:["Pour éviter que les deux sens de rotation soient alimentés en même temps","Pour économiser de l'énergie","Pour éviter la surchauffe du moteur uniquement","Pour que le store reste en position intermédiaire"],a:0,e:"Si les deux relais étaient fermés en même temps, deux phases seraient reliées au moteur : c'est un court-circuit. Le verrouillage réciproque l'empêche.",s:"Série 2021 · Pos. 4 Schéma d'installation · ex. 2"},
 {c:"Schémas & moteurs",q:"Combien de batteries 12 V raccordées en série faut-il pour obtenir 360 V DC dans une centrale d'éclairage de secours ?",o:["15","20","24","30"],a:3,e:"30 × 12 V = 360 V. Un bloc de 15 batteries ne donne que 180 V.",s:"Série 2022 · Pos. 4 Schéma d'installation · ex. 4"},
 {c:"Schémas & moteurs",q:"Comment doit être branché un ampèremètre pour mesurer le courant dans un circuit ?",o:["En série dans le circuit","En parallèle avec la charge","Entre phase et neutre, sans charge","En parallèle avec le voltmètre"],a:0,e:"Un ampèremètre se branche en série, car le courant à mesurer doit le traverser. Un voltmètre, lui, se branche en parallèle.",s:"Série 2021 · Pos. 4 Schéma d'installation · ex. 5"},
 {c:"Sécurité & matériel",q:"Pourquoi un enrouleur doit-il être complètement déroulé lorsqu'une forte charge y est raccordée ?",o:["Pour éviter son échauffement, car les spires enroulées s'échauffent","Pour réduire la tension","Pour augmenter le courant disponible","Pour éviter les courts-circuits uniquement"],a:0,e:"Les spires enroulées s'échauffent en charge et peuvent surchauffer le câble, avec un risque d'incendie.",s:"Série 2023 · Pos. 7 · ex. 11"},
 {c:"Bases & énergie",q:"Une plaque de cuisson massive transmet sa chaleur principalement par quel mode de transfert ?",o:["Conduction","Convection","Rayonnement","Induction magnétique"],a:0,e:"Dans un solide, la chaleur se transmet par conduction. La convection concerne les fluides (air, eau) et le rayonnement les ondes électromagnétiques.",s:"Série 2021 · Pos. 7 · ex. 15"},
 {c:"Bases & énergie",q:"Un radiateur infrarouge transmet sa chaleur principalement par quel mode de transfert ?",o:["Conduction","Convection","Rayonnement","Ébullition"],a:2,e:"Le radiateur infrarouge émet des ondes infrarouges qui chauffent directement les objets : c'est du rayonnement thermique.",s:"Série 2022 · Pos. 7 · ex. 12"},
 {c:"Bases & énergie",q:"Le passage de l'eau à l'état de vapeur s'appelle :",o:["La fusion","La solidification","La vaporisation","La condensation"],a:2,e:"La vaporisation (ébullition ou évaporation) est le passage du liquide à l'état gazeux. La condensation est l'inverse.",s:"Série 2022 · Pos. 7 · ex. 8"},
 {c:"Bases & énergie",q:"Une perceuse électrique transforme l'énergie électrique principalement en quelle forme ?",o:["Énergie calorifique","Énergie mécanique","Énergie lumineuse","Énergie chimique"],a:1,e:"La perceuse transforme l'énergie électrique en énergie mécanique (rotation de l'outil).",s:"Série 2023 · Pos. 7 · ex. 2"}
];
const CATS=["Calculs","Protection & NIBT","Schémas & moteurs","Sécurité & matériel","Bases & énergie"];
let active=new Set(CATS), sessionOn=true, deck=[], i=0, answers=[];
const app=document.getElementById("app"), filters=document.getElementById("filters");
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function renderFilters(){
  filters.innerHTML=CATS.map(c=>`<button class="chip" id="f-${CATS.indexOf(c)}" aria-pressed="${active.has(c)}" data-c="${c}">${c} · ${Q.filter(q=>q.c===c).length}</button>`).join("")+`<button class="chip" aria-pressed="${sessionOn}" data-mode="1">Session de 30</button>`;
}
filters.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  if(b.dataset.mode){ sessionOn=!sessionOn; renderFilters(); start(); return; }
  const c=b.dataset.c;
  if(active.has(c)){ if(active.size>1) active.delete(c); } else active.add(c);
  renderFilters(); start();
});

function start(){
  deck=shuffle(Q.filter(q=>active.has(q.c))).map(q=>{
    const idx=shuffle(q.o.map((_,k)=>k));
    return {...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};
  });
  if(sessionOn) deck=shuffle(deck).slice(0,30);
  i=0; answers=[]; show();
}
const correct=()=>answers.filter(x=>x.ok).length;

function show(){
  const q=deck[i], done=answers[i];
  app.innerHTML=`
   <div class="meta"><span class="tag">${q.c}</span><span>Question ${i+1} / ${deck.length}</span></div>
   <div class="bar"><i style="width:${(i/deck.length)*100}%"></i></div>
   <p class="q">${esc(q.q)}</p>
   ${q.s?`<p class="src">Source : ${esc(q.s)}</p>`:""}
   ${q.d?`<div class="data">${esc(q.d)}</div>`:""}
   <div class="opts">${q.o.map((o,k)=>`<button class="opt" id="opt-${k}" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
   <div id="fb"></div>
   <div class="actions"><span class="score">Score : ${correct()} / ${answers.length}</span><button class="btn" id="next" hidden>${i+1<deck.length?"Question suivante":"Voir le résultat"}</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.k)));
  document.getElementById("next").addEventListener("click",()=>{ i++; i<deck.length?show():result(); });
  if(done) reveal(done.pick);
}
function choose(k){ if(answers[i]) return; answers[i]={pick:k,ok:k===deck[i].a}; reveal(k); }
function reveal(k){
  const q=deck[i], ok=k===q.a;
  app.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true; if(n===q.a)b.classList.add("ok"); else if(n===k)b.classList.add("ko");});
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"":"bad"}"><strong>${ok?"Correct":"Pas tout à fait"}</strong><p>${esc(q.e)}</p></div>`;
  app.querySelector(".score").textContent=`Score : ${correct()} / ${answers.length}`;
  const n=document.getElementById("next"); n.hidden=false; n.focus();
}
function result(){
  const s=correct(), t=deck.length, pct=Math.round(s/t*100);
  const verdict=pct>=85?"Excellent, tu es prêt pour ces thèmes.":pct>=60?"Bonne base. Revois les questions manquées ci-dessous.":"Reprends les formules et la NIBT, puis refais le quiz.";
  const per=[...active].map(c=>{const idx=deck.map((q,n)=>q.c===c?n:-1).filter(n=>n>=0);return `<div><span>${c}</span>${idx.filter(n=>answers[n].ok).length} / ${idx.length}</div>`}).join("");
  const wrong=deck.map((q,n)=>({q,n})).filter(x=>!answers[x.n].ok);
  app.innerHTML=`
   <div class="result"><div class="meta"><span class="tag">Résultat</span><span>${pct} %</span></div>
   <h2>${s} / ${t}</h2><p class="verdict">${verdict}</p></div>
   <div class="cats">${per}</div>
   ${wrong.length?`<div class="review"><div class="meta"><span>Questions à revoir</span></div>${wrong.map(({q})=>`<article><p>${esc(q.q)}</p>${q.s?`<p class="src">Source : ${esc(q.s)}</p>`:""}<p class="ans">${esc(q.o[q.a])}</p><p class="exp">${esc(q.e)}</p></article>`).join("")}</div>`:""}
   <div class="actions"><button class="btn" id="again">Recommencer</button>${wrong.length?`<button class="btn ghost" id="retry">Refaire les erreurs</button>`:""}</div>`;
  document.getElementById("again").addEventListener("click",start);
  const r=document.getElementById("retry");
  if(r) r.addEventListener("click",()=>{ deck=shuffle(wrong.map(x=>x.q)); i=0; answers=[]; show(); });
}
renderFilters(); start();
</script>
